<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile — Smart Music App</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'css/profile.css' %}">
</head>
<body>
    <!-- Background decorations (reused from login) -->
    <div class="vinyl-ring"></div>
    <div class="vinyl-ring"></div>

    <div class="app-shell">

        <!-- ── Sidebar Nav ───────────────────────────────────
        This section is included on every page and displays the sidebar on the left side of our program
        Features:
            -Our logo on the top
            -Link to Dashboard
            -Link to Generate
            -Link to My Playlists
            -Link to Profile
            -Link to Logout
        -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <span class="logo-mark"></span>
                <span class="logo-text">SMA</span>
            </div>

            <nav class="sidebar-nav">
                <!-- ── Link to dashboard on the sidebar ─────────────────────────────────── -->
                <a href="{% url 'dashboard' %}" class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                    <span>Dashboard</span>
                </a>
                <!-- ── Link to generate on the sidebar ─────────────────────────────────── -->
                <a href="{% url 'generate' %}" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    <span>Generate</span>
                </a>
                <!-- ── Link to My Playlists on the sidebar ─────────────────────────────────── -->
                <a href="{% url 'playlists' %}" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                    <span>My Playlists</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <!-- ── Link to Profile on the sidebar ─────────────────────────────────── -->
                <a href="{% url 'profile' %}" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span>Profile</span>
                </a>
                <!-- ── Link to Logout on the sidebar ─────────────────────────────────── -->
                <form method="post" action="{% url 'spotify_logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="nav-item nav-logout">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        <span>Logout</span>
                    </button>
                </form>
            </div>
        </aside>

        <!-- ── Main Content ────────────────────────────────── -->
        <main class="main-content">

            <!-- Top bar -->
            <div class="profile-card">
                <header class="topbar">
                    <div class="topbar-greeting">
                        <h1 class="topbar-title">Profile</h1>
                    </div>
                </header>
                <!-- Spotify connection badge -->
                    {% if spotify_linked %}
                    <form method="post" action="{{ spotify_disconnect_url }}">
                        {% csrf_token %}
                        <button type="submit" class="badge badge--connected" style="border:none;">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
                                <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0z"/>
                            </svg>
                            Disconnect Spotify
                        </button>
                    </form>
                    {% else %}
                    <a href="{{ spotify_connect_url }}" class="badge badge--disconnected">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
                            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0z"/>
                        </svg>
                        Connect Spotify
                    </a>
                    {% endif %}
                    <div class="profile-info">
                        <div class="profile-item">
                            <span class="profile-label">Username</span>
                            <span class="profile-value">{{ display_name }}</span>
                        </div>
                        <div class="profile-item">
                            <span class="profile-label">Email</span>
                            <span class="profile-value">{{ email }}</span>
                        </div>
                        <div class="profile-item">
                            <span class="profile-label">Role</span>
                            <span class="profile-value">{{ role }}</span>
                        </div>
                    </div>

                    <a href="{{ password_change_url }}" class="roundedButton profile-button">
                        Change Password
                    </a>
                    <a href="{{ delete_account_url }}" class="roundedButton profile-button">
                        Delete account
                    </a>
            </div>

        </main>
    </div>
</body>
</html>
